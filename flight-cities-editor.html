<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flight Cities Editor — Andah</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('andah-theme');
                var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/flight-network.css">
</head>
<body>

<header class="site-bar">
    <div class="site-bar-inner">
        <a class="site-brand" href="index.html">Andah Games</a>
        <nav class="site-nav" aria-label="Site">
            <a href="flight-network.html">Flight Network</a>
            <a href="flight-tagger.html">Tagger</a>
            <button type="button" class="theme-toggle" aria-label="Toggle theme">☾ Dark</button>
        </nav>
    </div>
</header>

<div class="fce-shell">
    <aside class="fce-side">
        <div class="fce-toolbar">
            <div class="fce-toolbar-row">
                <strong>City Editor</strong>
                <span id="fce-progress" class="tagger-counts"></span>
            </div>
            <input type="search" id="fce-search" class="fce-search" placeholder="Search name, nation, or #number…" aria-label="Search airports">
            <div class="tagger-actions">
                <button type="button" id="fce-export">Download flight-cities.json</button>
                <button type="button" id="fce-reset" class="tagger-danger">Reset to City 1…N</button>
                <button type="button" id="fce-reload" class="tagger-danger">Reload from file</button>
            </div>
            <p class="muted" style="font-size:0.78rem;margin:0">
                Click a row to find its dot on the map (or click a dot to jump to its row). Edits autosave to
                this browser — when done, <strong>Download</strong> and save the file to <code>data/flight-cities.json</code>.
            </p>
        </div>
        <div id="fce-list" class="fce-list"></div>
    </aside>

    <div id="fce-map" class="tagger-viewport fce-map">
        <canvas id="fce-canvas"></canvas>
        <div class="flight-status" id="fce-status">Loading…</div>
    </div>
</div>

<script src="js/script.js"></script>
<script type="module" src="js/flight-cities-editor.js"></script>
</body>
</html>
