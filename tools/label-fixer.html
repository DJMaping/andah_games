<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Andah map label fixer</title>
<style>
  :root {
    --bg: #0b1016; --panel: #131b24; --line: #223040; --ink: #dbe6f0;
    --dim: #7d8fa3; --accent: #4aa8ff; --warn: #ffb020; --bad: #ff4fa8; --good: #3ddc97;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; background: var(--bg); color: var(--ink);
         font: 13px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; overflow: hidden; }
  #stage { flex: 1; position: relative; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
  #tip { position: absolute; pointer-events: none; background: #000d; border: 1px solid var(--line);
         padding: 6px 9px; border-radius: 6px; font-size: 12px; max-width: 280px; display: none; }
  #tip b { color: var(--accent); }
  #bar { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  #bar button, #side button { background: var(--panel); color: var(--ink); border: 1px solid var(--line);
         padding: 5px 10px; border-radius: 6px; cursor: pointer; font: inherit; }
  #bar button:hover, #side button:hover { border-color: var(--accent); }
  #bar button.on { background: var(--accent); color: #04121f; border-color: var(--accent); }
  #side { width: 400px; background: var(--panel); border-left: 1px solid var(--line);
          display: flex; flex-direction: column; overflow: hidden; }
  #side header { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  #side h1 { margin: 0 0 8px; font-size: 15px; }
  #stats { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; font-size: 12px; color: var(--dim); }
  #stats b { color: var(--ink); font-variant-numeric: tabular-nums; }
  #sel { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  #sel .none { color: var(--dim); font-style: italic; }
  #sel dl { margin: 0 0 10px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px; }
  #sel dt { color: var(--dim); }
  #sel dd { margin: 0; font-variant-numeric: tabular-nums; }
  #sel .why { color: var(--dim); font-size: 12px; margin: 6px 0 10px; font-style: italic; }
  #pick { width: 100%; padding: 6px 8px; background: #0b1016; color: var(--ink);
          border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  #acts { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  #list { flex: 1; overflow-y: auto; }
  #list h2 { margin: 0; padding: 10px 14px 6px; font-size: 11px; letter-spacing: .08em;
             text-transform: uppercase; color: var(--dim); position: sticky; top: 0; background: var(--panel); }
  .row { padding: 6px 14px; border-bottom: 1px solid #1a232e; cursor: pointer; display: flex;
         justify-content: space-between; gap: 10px; }
  .row:hover { background: #1a2431; }
  .row .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .v { color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row .v.bad { color: var(--bad); } .row .v.warn { color: var(--warn); }
  #foot { padding: 10px 14px; border-top: 1px solid var(--line); display: flex; gap: 6px; align-items: center; }
  #foot .c { flex: 1; color: var(--dim); font-size: 12px; }
  .chip { display: inline-block; padding: 1px 6px; border-radius: 999px; font-size: 11px; }
  .c-high { background: #12402e; color: var(--good); }
  .c-resolved { background: #45330c; color: var(--warn); }
  .c-medium { background: #4a2a10; color: #ffa657; }
  .c-island { background: #123a52; color: #6fc6ff; }
  .c-none { background: #4a1030; color: var(--bad); }
  .c-manual { background: #1b3560; color: #9dc4ff; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="map"></canvas>
  <div id="tip"></div>
  <div id="bar">
    <button id="mByCountry" class="on">Colour by country</button>
    <button id="mByConf">Colour by evidence</button>
    <button id="mMarks" class="on">Mark unidentified</button>
    <button id="mReset">Reset view</button>
  </div>
</div>

<div id="side">
  <header>
    <h1>Map label fixer</h1>
    <div id="stats"></div>
  </header>

  <div id="sel"><div class="none">Click a region on the map, or a row below.</div></div>

  <div id="list"></div>

  <div id="foot">
    <span class="c" id="ocount"></span>
    <button id="load">Load…</button>
    <button id="save">Download overrides</button>
  </div>
</div>

<datalist id="countries"></datalist>
<input type="file" id="file" accept="application/json" hidden>

<script src="../build/fixer-data.js"></script>
<script>
const F = window.FIXER;
const RW = F.rasterWidth, RH = F.rasterHeight;
const byId = new Map(F.regions.map(r => [r.id, r]));
const IGNORE = '__ignore__';

// Overrides survive a page reload, so a long labelling session is not lost.
const STORE = 'andah-map-overrides';
let overrides = {};
try { overrides = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) { overrides = null; }
// Fall back to whatever is already committed in data/map-label-overrides.json,
// so a fresh browser starts from the decisions already made rather than from
// the automatic labelling.
if (!overrides || !Object.keys(overrides).length) overrides = normalise(F.saved || {});

/** Accept both the plain id->name form and the richer id->{name, at} form. */
function normalise(table) {
  const out = {};
  for (const [k, v] of Object.entries(table)) {
    if (k.startsWith('_')) continue;
    out[k] = v && typeof v === 'object' ? v.name : v;
  }
  return out;
}

const effective = (r) => (Object.prototype.hasOwnProperty.call(overrides, r.id) ? overrides[r.id] : r.a);
const isReal = (v) => typeof v === 'string' && v !== IGNORE;

// ---------------------------------------------------------------- colours

function hueOf(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h % 360; }
function hsv(h, s, v) {
  const c = v * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = v - c;
  const t = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x]
          : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
  return [(t[0] + m) * 255 | 0, (t[1] + m) * 255 | 0, (t[2] + m) * 255 | 0];
}
const CONF_RGB = {
  high: [61, 220, 151], resolved: [255, 176, 32], medium: [255, 166, 87],
  island: [111, 198, 255], manual: [157, 196, 255],
};
let mode = 'country';
let lut = new Uint32Array(0);

function buildLut() {
  let max = 0; for (const r of F.regions) if (r.id > max) max = r.id;
  lut = new Uint32Array(max + 1);
  for (const r of F.regions) {
    const v = effective(r);
    let rgb;
    if (!isReal(v)) rgb = v === IGNORE ? [70, 82, 96] : [255, 0, 170];
    else if (mode === 'country') rgb = hsv(hueOf(v), 0.5, v.charCodeAt(0) % 2 ? 0.95 : 0.72);
    else rgb = CONF_RGB[Object.prototype.hasOwnProperty.call(overrides, r.id) ? 'manual' : (r.conf || 'high')] || [200, 200, 200];
    lut[r.id] = (255 << 24) | (rgb[2] << 16) | (rgb[1] << 8) | rgb[0];
  }
}

// ------------------------------------------------------------ id raster

const cvs = document.getElementById('map');
const ctx = cvs.getContext('2d', { alpha: false });
let ids = null;
const img = new Image();
img.onload = () => {
  const off = document.createElement('canvas');
  off.width = RW; off.height = RH;
  const octx = off.getContext('2d', { willReadFrequently: true });
  octx.drawImage(img, 0, 0);
  const d = octx.getImageData(0, 0, RW, RH).data;
  ids = new Uint16Array(RW * RH);
  for (let i = 0, p = 0; i < ids.length; i++, p += 4) ids[i] = d[p] | (d[p + 1] << 8);
  buildLut(); resize(); refresh();
};
img.src = F.ids;

// ------------------------------------------------------------ viewport

let view = { scale: 1, x: 0, y: 0 }; // raster px -> css px
let buf = null, bufW = 0, bufH = 0;

function fit() {
  const w = cvs.clientWidth, h = cvs.clientHeight;
  view.scale = Math.min(w / RW, h / RH);
  view.x = (w - RW * view.scale) / 2;
  view.y = (h - RH * view.scale) / 2;
}
function resize() {
  // The id raster is a data URI, so it can decode before the page has been laid
  // out and the canvas still measures zero. Bail rather than asking for an
  // image buffer of width nought; the observer below calls back once it is real.
  const w = cvs.clientWidth, h = cvs.clientHeight;
  if (w < 1 || h < 1) return false;
  cvs.width = w; cvs.height = h;
  if (!view.ready) { fit(); view.ready = true; }
  bufW = w; bufH = h;
  buf = ctx.createImageData(bufW, bufH);
  return true;
}
new ResizeObserver(() => { if (resize()) draw(); }).observe(document.getElementById('stage'));

function draw() {
  if (!ids || !buf) return;
  const px = new Uint32Array(buf.data.buffer);
  const inv = 1 / view.scale;
  const bg = (255 << 24) | (34 << 16) | (22 << 8) | 12;
  for (let y = 0; y < bufH; y++) {
    const ry = ((y - view.y) * inv) | 0;
    const rowOk = ry >= 0 && ry < RH;
    const base = ry * RW, o = y * bufW;
    for (let x = 0; x < bufW; x++) {
      let c = bg;
      if (rowOk) {
        const rx = ((x - view.x) * inv) | 0;
        if (rx >= 0 && rx < RW) { const id = ids[base + rx]; if (id) c = lut[id]; }
      }
      px[o + x] = c;
    }
  }
  ctx.putImageData(buf, 0, 0);

  // Rings over unidentified land, which is otherwise too small to spot zoomed out.
  if (marks) {
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#ff00aa';
    for (const r of F.regions) {
      if (isReal(effective(r)) || r.px < 40 || !r.i) continue;
      const cx = r.i[0] * RW / F.width * view.scale + view.x;
      const cy = r.i[1] * RH / F.height * view.scale + view.y;
      if (cx < -20 || cy < -20 || cx > bufW + 20 || cy > bufH + 20) continue;
      ctx.beginPath(); ctx.arc(cx, cy, 7, 0, 6.284); ctx.stroke();
    }
  }
  if (selected) {
    const r = byId.get(selected);
    if (r && r.i) {
      const cx = r.i[0] * RW / F.width * view.scale + view.x;
      const cy = r.i[1] * RH / F.height * view.scale + view.y;
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, 11, 0, 6.284); ctx.stroke();
      ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(cx, cy, 13, 0, 6.284); ctx.stroke();
    }
  }
}

let marks = true, selected = null;

// -------------------------------------------------------------- pointer

function regionAtEvent(e) {
  if (!ids) return 0;
  const b = cvs.getBoundingClientRect();
  const rx = ((e.clientX - b.left - view.x) / view.scale) | 0;
  const ry = ((e.clientY - b.top - view.y) / view.scale) | 0;
  if (rx < 0 || ry < 0 || rx >= RW || ry >= RH) return 0;
  return ids[ry * RW + rx];
}
const tip = document.getElementById('tip');
let drag = null;
cvs.addEventListener('mousedown', (e) => { drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false }; });
window.addEventListener('mouseup', () => { drag = null; });
cvs.addEventListener('mousemove', (e) => {
  if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
    view.x = drag.vx + dx; view.y = drag.vy + dy;
    draw(); tip.style.display = 'none';
    return;
  }
  const id = regionAtEvent(e);
  if (!id) { tip.style.display = 'none'; return; }
  const r = byId.get(id); if (!r) { tip.style.display = 'none'; return; }
  const v = effective(r);
  tip.innerHTML = `<b>${isReal(v) ? v : (v === IGNORE ? 'ignored' : 'not identified')}</b><br>`
    + `region ${r.id} · ${r.px.toLocaleString()} px · ${r.km2.toLocaleString()} km²`;
  tip.style.display = 'block';
  const b = cvs.getBoundingClientRect();
  tip.style.left = Math.min(e.clientX - b.left + 14, b.width - 290) + 'px';
  tip.style.top = (e.clientY - b.top + 14) + 'px';
});
cvs.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
cvs.addEventListener('click', (e) => { if (drag && drag.moved) return; select(regionAtEvent(e) || null); });
cvs.addEventListener('wheel', (e) => {
  e.preventDefault();
  const b = cvs.getBoundingClientRect();
  const mx = e.clientX - b.left, my = e.clientY - b.top;
  const k = Math.exp(-e.deltaY * 0.0015);
  const ns = Math.max(0.05, Math.min(24, view.scale * k));
  view.x = mx - (mx - view.x) * (ns / view.scale);
  view.y = my - (my - view.y) * (ns / view.scale);
  view.scale = ns;
  draw();
}, { passive: false });

function centreOn(r) {
  if (!r || !r.i) return;
  view.scale = Math.max(view.scale, 4);
  view.x = cvs.width / 2 - (r.i[0] * RW / F.width) * view.scale;
  view.y = cvs.height / 2 - (r.i[1] * RH / F.height) * view.scale;
}

// ------------------------------------------------------------- sidebar

const dl = document.getElementById('countries');
dl.innerHTML = F.countries.map(n => `<option value="${n}">`).join('');

function tracedByCountry() {
  const m = new Map();
  for (const r of F.regions) {
    const v = effective(r);
    if (!isReal(v)) continue;
    m.set(v, (m.get(v) || 0) + r.km2);
  }
  return m;
}

function select(id) {
  selected = id;
  const box = document.getElementById('sel');
  if (!id || !byId.has(id)) {
    box.innerHTML = '<div class="none">Click a region on the map, or a row below.</div>';
    draw(); return;
  }
  const r = byId.get(id);
  const v = effective(r);
  const manual = Object.prototype.hasOwnProperty.call(overrides, r.id);
  const conf = manual ? 'manual' : (r.conf || 'none');
  const traced = tracedByCountry();
  const canon = isReal(v) ? F.canonical[v] : null;
  const have = isReal(v) ? (traced.get(v) || 0) : 0;
  box.innerHTML = `
    <dl>
      <dt>Region</dt><dd>${r.id}${r.drawn ? '' : ' <span style="color:var(--dim)">(too small to click)</span>'}</dd>
      <dt>Size</dt><dd>${r.px.toLocaleString()} px · ${r.km2.toLocaleString()} km²</dd>
      <dt>Centre</dt><dd>${r.c[0].toFixed(1)}, ${r.c[1].toFixed(1)}</dd>
      <dt>Label</dt><dd>${isReal(v) ? v : (v === IGNORE ? '<i>ignored</i>' : '<i>not identified</i>')}
        <span class="chip c-${conf}">${conf}</span></dd>
      ${canon ? `<dt>Country</dt><dd>${Math.round(have).toLocaleString()} of ${Math.round(canon).toLocaleString()} km²
        (${have > canon ? '+' : ''}${(100 * (have - canon) / canon).toFixed(1)}%)</dd>` : ''}
    </dl>
    <div class="why">${r.why || ''}</div>
    <input id="pick" list="countries" placeholder="Type a country name…" value="${isReal(v) ? v : ''}">
    <div id="acts">
      <button id="apply">Assign</button>
      <button id="clear">Not identified</button>
      <button id="ign">Ignore (artefact)</button>
      ${manual ? '<button id="undo">Undo override</button>' : ''}
    </div>`;
  const pick = document.getElementById('pick');
  pick.focus(); pick.select();
  const setTo = (val) => { overrides[r.id] = val; persist(); refresh(); select(r.id); };
  document.getElementById('apply').onclick = () => {
    const n = pick.value.trim();
    if (!F.countries.includes(n)) { pick.style.borderColor = 'var(--bad)'; return; }
    setTo(n);
  };
  pick.onkeydown = (e) => { if (e.key === 'Enter') document.getElementById('apply').click(); };
  document.getElementById('clear').onclick = () => setTo(null);
  document.getElementById('ign').onclick = () => setTo(IGNORE);
  const u = document.getElementById('undo');
  if (u) u.onclick = () => { delete overrides[r.id]; persist(); refresh(); select(r.id); };
  draw();
}

function refresh() {
  buildLut();
  const traced = tracedByCountry();
  const named = new Set([...traced.keys()]);
  let disputed = 0, missing = 0;
  for (const n of F.countries) {
    const canon = F.canonical[n];
    if (!canon) continue;
    if (!named.has(n)) { missing++; disputed += canon; continue; }
    disputed += Math.abs(traced.get(n) - canon);
  }
  const unid = F.regions.filter(r => !isReal(effective(r)) && effective(r) !== IGNORE);
  const unidKm2 = unid.reduce((s, r) => s + r.km2, 0);

  document.getElementById('stats').innerHTML = `
    <span>Identified</span><b>${named.size} / ${F.countries.length}</b>
    <span>Area misplaced</span><b>${(100 * disputed / F.canonicalLandKm2).toFixed(2)}%</b>
    <span>Unidentified</span><b>${unid.length} regions</b>
    <span>…covering</span><b>${unidKm2.toLocaleString()} km²</b>`;

  // Things worth a human eye, worst first.
  const rows = [];
  for (const n of F.countries) {
    const canon = F.canonical[n]; if (!canon) continue;
    const have = traced.get(n) || 0;
    const off = have - canon, pct = 100 * off / canon;
    if (Math.abs(pct) < 15) continue;
    const mine = F.regions.filter(r => effective(r) === n).sort((a, b) => b.km2 - a.km2);
    rows.push({ group: 'Countries whose area does not add up', n,
      v: `${off > 0 ? '+' : ''}${pct.toFixed(0)}%`, sort: Math.abs(off),
      cls: Math.abs(pct) > 50 ? 'bad' : 'warn', id: mine.length ? mine[0].id : null });
  }
  for (const r of unid) {
    if (r.px < 200) continue;
    rows.push({ group: 'Unidentified land', n: `Region ${r.id}`,
      v: `${r.km2.toLocaleString()} km²`, sort: r.km2, cls: 'warn', id: r.id });
  }
  const groups = ['Countries whose area does not add up', 'Unidentified land'];
  const list = document.getElementById('list');
  list.innerHTML = groups.map(g => {
    const sub = rows.filter(r => r.group === g).sort((a, b) => b.sort - a.sort);
    if (!sub.length) return '';
    return `<h2>${g} (${sub.length})</h2>` + sub.map(r =>
      `<div class="row" data-id="${r.id || ''}"><span class="n">${r.n}</span><span class="v ${r.cls}">${r.v}</span></div>`).join('');
  }).join('') || '<h2>Nothing outstanding</h2>';
  list.querySelectorAll('.row').forEach(el => {
    el.onclick = () => {
      const id = +el.dataset.id; if (!id) return;
      centreOn(byId.get(id)); select(id);
    };
  });

  document.getElementById('ocount').textContent =
    `${Object.keys(overrides).length} override${Object.keys(overrides).length === 1 ? '' : 's'}`;
  draw();
}

function persist() { try { localStorage.setItem(STORE, JSON.stringify(overrides)); } catch (e) {} }

// --------------------------------------------------------------- controls

const set = (id, on) => document.getElementById(id).classList.toggle('on', on);
document.getElementById('mByCountry').onclick = () => { mode = 'country'; set('mByCountry', true); set('mByConf', false); refresh(); };
document.getElementById('mByConf').onclick = () => { mode = 'conf'; set('mByCountry', false); set('mByConf', true); refresh(); };
document.getElementById('mMarks').onclick = () => { marks = !marks; set('mMarks', marks); draw(); };
document.getElementById('mReset').onclick = () => { fit(); draw(); };
window.addEventListener('keydown', (e) => { if (e.key === 'Escape') select(null); });

document.getElementById('save').onclick = () => {
  // Each correction carries a point inside its region as well as the id.
  // Region ids are renumbered whenever the source map gains or loses land, so
  // the point is what actually survives an edit to the artwork.
  const rich = {};
  for (const [id, name] of Object.entries(overrides)) {
    const r = byId.get(+id);
    rich[id] = { name, at: r && r.i ? r.i : null };
  }
  const body = JSON.stringify({
    _note: 'Hand corrections to the automatic map labelling. Keyed by region id, but resolved by "at", a point inside that region, because ids are renumbered whenever the source map changes. null name means unidentified, "__ignore__" means artefact. Read by tools/label-regions.cjs.',
    _generated: new Date().toISOString(),
    overrides: rich,
  }, null, 1);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([body], { type: 'application/json' }));
  a.download = 'map-label-overrides.json';
  a.click();
};
document.getElementById('load').onclick = () => document.getElementById('file').click();
document.getElementById('file').onchange = (e) => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => {
    const j = JSON.parse(t);
    overrides = normalise(j.overrides || j);
    persist(); refresh(); select(null);
  });
};
</script>
</body>
</html>
