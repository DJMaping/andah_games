<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Andah World Map</title>
<link rel="icon" href="favicon.png">
<style>
  :root {
    --bg: #0b1016; --panel: #121a23; --line: #223040; --ink: #e2ecf5; --dim: #8ba0b5;
    --accent: #4aa8ff; --ocean: #08131f; --graticule: #16293c; --border: #0a1119;
    --shadow: 0 10px 30px rgba(0,0,0,.45);
  }
  :root[data-theme="light"] {
    --bg: #f4f7fa; --panel: #ffffff; --line: #d8e2ec; --ink: #16222e; --dim: #5f7688;
    --accent: #0b63ce; --ocean: #dbe9f6; --graticule: #c3d8ea; --border: #ffffff;
    --shadow: 0 8px 24px rgba(20,40,60,.12);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--ink);
         font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; overflow: hidden; }

  header { display: flex; align-items: center; gap: 10px; padding: 8px 12px;
           border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { margin: 0 8px 0 0; font-size: 15px; font-weight: 650; white-space: nowrap; }
  .ctl { display: flex; align-items: center; gap: 6px; }
  button, select, input {
    background: var(--bg); color: var(--ink); border: 1px solid var(--line);
    border-radius: 7px; padding: 6px 10px; font: inherit;
  }
  button { cursor: pointer; }
  button:hover, select:hover { border-color: var(--accent); }
  button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  #search { width: 190px; }
  .spacer { flex: 1; }

  main { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; position: relative; min-width: 0; }
  /* touch-action:none stops the browser claiming drags and pinches for
     scrolling and page zoom before the map ever sees them. */
  canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  canvas.dragging { cursor: grabbing; }
  canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
        overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  #tip { position: absolute; pointer-events: none; display: none; background: var(--panel);
         border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px;
         box-shadow: var(--shadow); white-space: nowrap; }
  #tip b { color: var(--accent); }
  #legend { position: absolute; left: 12px; bottom: 12px; background: var(--panel);
            border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; display: none;
            box-shadow: var(--shadow); max-width: 260px; }
  #legend .t { font-size: 12px; color: var(--dim); margin-bottom: 6px; }
  #legend .row { display: flex; align-items: center; gap: 7px; font-size: 12px;
                 font-variant-numeric: tabular-nums; }
  #legend i { width: 15px; height: 11px; border-radius: 2px; display: inline-block; }
  #hint { position: absolute; right: 12px; bottom: 12px; color: var(--dim); font-size: 12px; }

  aside { width: 370px; background: var(--panel); border-left: 1px solid var(--line);
          display: flex; flex-direction: column; overflow: hidden; }
  #empty { padding: 26px 18px; color: var(--dim); }
  #card { flex: 1; overflow-y: auto; display: none; }
  /* ---- country panel ---- */
  .head { padding: 16px 18px 14px; border-bottom: 1px solid var(--line); }
  .head .top { display: flex; gap: 14px; align-items: flex-start; }
  .head img { width: 84px; height: auto; border: 1px solid var(--line); border-radius: 4px;
              box-shadow: 0 2px 8px rgba(0,0,0,.25); flex: none; }
  .head .who { min-width: 0; }
  .head h2 { margin: 0; font-size: 22px; line-height: 1.15; letter-spacing: -.01em; }
  .head .long { color: var(--dim); font-size: 13px; margin-top: 3px; }
  .head .say { color: var(--dim); font-size: 12px; margin-top: 5px; font-style: italic; }
  .head .where { margin-top: 8px; font-size: 12px; color: var(--dim); }
  .head .where b { color: var(--ink); font-weight: 500; }
  .head .links { margin-top: 12px; display: flex; gap: 7px; flex-wrap: wrap; }
  .btn { font-size: 12.5px; padding: 5px 11px; text-decoration: none; display: inline-block;
         border: 1px solid var(--line); border-radius: 7px; color: var(--ink); background: var(--bg);
         cursor: pointer; font-family: inherit; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Headline figures. The value gets its own line at a size you can read at a
     glance; the rank sits under it rather than being jammed onto the end of
     the number, where "81,313,729" and "19th" ran together into one string. */
  .keys { padding: 14px 18px 4px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
  .key .lab { color: var(--dim); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; }
  .key .num { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums;
              line-height: 1.15; margin-top: 3px; white-space: nowrap;
              overflow: hidden; text-overflow: ellipsis; }
  .key .num u { text-decoration: none; color: var(--dim); font-size: 12px; font-weight: 400; margin-left: 4px; }
  .key .rank { margin-top: 5px; font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .key .bar { height: 3px; background: var(--line); border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .key .bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }

  details { border-top: 1px solid var(--line); }
  details[open] summary { color: var(--ink); }
  summary { padding: 11px 18px; cursor: pointer; color: var(--dim); font-size: 11px;
            text-transform: uppercase; letter-spacing: .09em; user-select: none; }
  summary:hover { color: var(--ink); }
  summary::marker { color: var(--line); }

  /* Label above value. A two-column list at 370px wrapped every long value
     into an unreadable column two or three words wide. */
  .body { padding: 0 18px 16px; }
  .fact { padding: 7px 0; border-bottom: 1px solid rgba(127,127,127,.12); }
  .fact:last-child { border-bottom: 0; }
  .fact dt { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .fact dd { margin: 2px 0 0; font-size: 13.5px; line-height: 1.45; }
  .fact.inline { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; }
  .fact.inline dd { font-variant-numeric: tabular-nums; text-align: right; }
  .fact dd .rk { color: var(--dim); font-size: 11px; margin-left: 7px; }

  /* Proportion breakdowns, with the nesting the infobox actually has. */
  .split { margin: 4px 0 0; }
  .split .s { margin-top: 7px; }
  .split .s.sub { margin-left: 14px; }
  .split .t { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
  .split .t span { color: var(--dim); font-variant-numeric: tabular-nums; }
  .split .s.sub .t { font-size: 12px; color: var(--dim); }
  .split .g { height: 4px; border-radius: 2px; background: var(--line); margin-top: 3px; overflow: hidden; }
  .split .g i { display: block; height: 100%; border-radius: 2px; background: var(--accent); opacity: .85; }
  .split .s.sub .g i { opacity: .45; }

  .tl { margin: 2px 0 0; }
  .tl .e { display: flex; gap: 12px; padding: 5px 0; font-size: 13px; }
  .tl .e time { color: var(--accent); font-variant-numeric: tabular-nums; flex: none; width: 84px; }

  .chips { padding: 0 18px 16px; display: flex; flex-wrap: wrap; gap: 7px; }
  .chip { display: inline-flex; align-items: baseline; gap: 7px; padding: 5px 10px;
          border: 1px solid var(--line); border-radius: 999px; background: var(--bg);
          color: var(--ink); font: inherit; font-size: 12.5px; cursor: pointer; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip span { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
  .lone { padding: 0 18px 14px; color: var(--dim); font-size: 12.5px; font-style: italic; }

  #tray { border-top: 1px solid var(--line); padding: 8px 12px; display: none; }
  #tray h3 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--dim); }
  #tray table { width: 100%; border-collapse: collapse; font-size: 12px; }
  #tray th, #tray td { text-align: right; padding: 2px 4px; font-variant-numeric: tabular-nums; }
  #tray th:first-child, #tray td:first-child { text-align: left; }
  #tray thead th { color: var(--dim); font-weight: 500; }
  #tray .x { cursor: pointer; color: var(--dim); }
  #tray .x:hover { color: var(--accent); }

  @media (max-width: 900px) {
    main { flex-direction: column; }
    aside { width: auto; height: 45%; border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>Andah <span style="color:var(--dim);font-weight:400">1765</span></h1>
  <div class="ctl">
    <input id="search" list="countrylist" placeholder="Find a nation…" autocomplete="off">
    <datalist id="countrylist"></datalist>
  </div>
  <div class="ctl">
    <button id="toGlobe" class="on" title="Show as a globe">Globe</button>
    <button id="toFlat" title="Show as a flat map">Map</button>
    <select id="proj" title="Projection used for the flat map">
      <option value="equirectangular">Equirectangular</option>
      <option value="naturalEarth">Natural Earth</option>
      <option value="robinson">Robinson</option>
      <option value="mollweide">Mollweide</option>
      <option value="winkel3">Winkel Tripel</option>
    </select>
  </div>
  <div class="ctl">
    <select id="metric" title="Colour every nation by a statistic"></select>
  </div>
  <div class="spacer"></div>
  <div class="ctl">
    <button id="labels" class="on" title="Show country names">Labels</button>
    <button id="cities" title="Show cities">Cities</button>
    <button id="theme" title="Light or dark">Theme</button>
  </div>
</header>

<main>
  <div id="stage">
    <canvas id="map"></canvas>
    <div id="tip"></div>
    <div id="legend"></div>
    <div id="hint">drag to turn · scroll to zoom · click a nation</div>
    <p class="sr" id="say" role="status" aria-live="polite"></p>
  </div>
  <aside>
    <div id="empty">Click any nation to see its figures, or search for one above.</div>
    <div id="card"></div>
    <div id="tray"></div>
  </aside>
</main>

<script src="js/vendor/d3-array.min.js"></script>
<script src="js/vendor/d3-geo.min.js"></script>
<script src="js/vendor/d3-geo-projection.min.js"></script>
<script src="js/world-map.js?v=2c4a388d"></script>
</body>
</html>
