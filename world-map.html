<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Andah World Map</title>
<link rel="icon" href="favicon.png">
<style>
  :root {
    --bg: #0b1016; --panel: #121a23; --line: #223040; --ink: #e2ecf5; --dim: #8ba0b5;
    --accent: #4aa8ff; --ocean: #08131f; --graticule: #16293c; --border: #0a1119;
    --shadow: 0 10px 30px rgba(0,0,0,.45);
  }
  :root[data-theme="light"] {
    --bg: #f4f7fa; --panel: #ffffff; --line: #d8e2ec; --ink: #16222e; --dim: #5f7688;
    --accent: #0b63ce; --ocean: #dbe9f6; --graticule: #c3d8ea; --border: #ffffff;
    --shadow: 0 8px 24px rgba(20,40,60,.12);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--ink);
         font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; overflow: hidden; }

  header { display: flex; align-items: center; gap: 10px; padding: 8px 12px;
           border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { margin: 0 8px 0 0; font-size: 15px; font-weight: 650; white-space: nowrap; }
  .ctl { display: flex; align-items: center; gap: 6px; }
  button, select, input {
    background: var(--bg); color: var(--ink); border: 1px solid var(--line);
    border-radius: 7px; padding: 6px 10px; font: inherit;
  }
  button { cursor: pointer; }
  button:hover, select:hover { border-color: var(--accent); }
  button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  #search { width: 190px; }
  .spacer { flex: 1; }

  main { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; position: relative; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  #tip { position: absolute; pointer-events: none; display: none; background: var(--panel);
         border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px;
         box-shadow: var(--shadow); white-space: nowrap; }
  #tip b { color: var(--accent); }
  #legend { position: absolute; left: 12px; bottom: 12px; background: var(--panel);
            border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; display: none;
            box-shadow: var(--shadow); max-width: 260px; }
  #legend .t { font-size: 12px; color: var(--dim); margin-bottom: 6px; }
  #legend .row { display: flex; align-items: center; gap: 7px; font-size: 12px;
                 font-variant-numeric: tabular-nums; }
  #legend i { width: 15px; height: 11px; border-radius: 2px; display: inline-block; }
  #hint { position: absolute; right: 12px; bottom: 12px; color: var(--dim); font-size: 12px; }

  aside { width: 370px; background: var(--panel); border-left: 1px solid var(--line);
          display: flex; flex-direction: column; overflow: hidden; }
  #empty { padding: 26px 18px; color: var(--dim); }
  #card { flex: 1; overflow-y: auto; display: none; }
  .head { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
  .head .top { display: flex; gap: 12px; align-items: flex-start; }
  .head img { width: 62px; height: auto; border: 1px solid var(--line); border-radius: 3px; }
  .head h2 { margin: 0; font-size: 19px; line-height: 1.2; }
  .head .long { color: var(--dim); font-size: 12.5px; margin-top: 2px; }
  .head .say { color: var(--dim); font-size: 12px; margin-top: 4px; font-style: italic; }
  .head .links { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  .head a.btn, .head button.btn { font-size: 12.5px; padding: 4px 9px; text-decoration: none;
    display: inline-block; border: 1px solid var(--line); border-radius: 6px; color: var(--ink); background: var(--bg); }
  .head a.btn:hover { border-color: var(--accent); color: var(--accent); }

  .stats { padding: 10px 16px; display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; }
  .stats .k { color: var(--dim); font-size: 12.5px; }
  .stats .v { text-align: right; font-variant-numeric: tabular-nums; }
  .stats .v small { color: var(--dim); margin-left: 5px; font-size: 11px; }
  .bar { grid-column: 1 / -1; height: 3px; background: var(--line); border-radius: 2px; margin: 1px 0 5px; }
  .bar i { display: block; height: 100%; border-radius: 2px; background: var(--accent); }

  details { border-top: 1px solid var(--line); }
  summary { padding: 9px 16px; cursor: pointer; color: var(--dim); font-size: 12px;
            text-transform: uppercase; letter-spacing: .07em; }
  summary:hover { color: var(--ink); }
  details .body { padding: 2px 16px 14px; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
  details .body dt { color: var(--dim); }
  details .body dd { margin: 0; }

  #tray { border-top: 1px solid var(--line); padding: 8px 12px; display: none; }
  #tray h3 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--dim); }
  #tray table { width: 100%; border-collapse: collapse; font-size: 12px; }
  #tray th, #tray td { text-align: right; padding: 2px 4px; font-variant-numeric: tabular-nums; }
  #tray th:first-child, #tray td:first-child { text-align: left; }
  #tray thead th { color: var(--dim); font-weight: 500; }
  #tray .x { cursor: pointer; color: var(--dim); }
  #tray .x:hover { color: var(--accent); }

  @media (max-width: 900px) {
    main { flex-direction: column; }
    aside { width: auto; height: 45%; border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>Andah <span style="color:var(--dim);font-weight:400">1765</span></h1>
  <div class="ctl">
    <input id="search" list="countrylist" placeholder="Find a nation…" autocomplete="off">
    <datalist id="countrylist"></datalist>
  </div>
  <div class="ctl">
    <button id="toGlobe" class="on" title="Show as a globe">Globe</button>
    <button id="toFlat" title="Show as a flat map">Map</button>
    <select id="proj" title="Projection used for the flat map">
      <option value="equirectangular">Equirectangular</option>
      <option value="naturalEarth">Natural Earth</option>
      <option value="robinson">Robinson</option>
      <option value="mollweide">Mollweide</option>
      <option value="winkel3">Winkel Tripel</option>
    </select>
  </div>
  <div class="ctl">
    <select id="metric" title="Colour every nation by a statistic"></select>
  </div>
  <div class="spacer"></div>
  <div class="ctl">
    <button id="cities" title="Show cities">Cities</button>
    <button id="theme" title="Light or dark">Theme</button>
  </div>
</header>

<main>
  <div id="stage">
    <canvas id="map"></canvas>
    <div id="tip"></div>
    <div id="legend"></div>
    <div id="hint">drag to turn · scroll to zoom · click a nation</div>
  </div>
  <aside>
    <div id="empty">Click any nation to see its figures, or search for one above.</div>
    <div id="card"></div>
    <div id="tray"></div>
  </aside>
</main>

<script src="js/vendor/d3-array.min.js"></script>
<script src="js/vendor/d3-geo.min.js"></script>
<script src="js/vendor/d3-geo-projection.min.js"></script>
<script src="js/world-map.js"></script>
</body>
</html>
