<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Andah · Top 20 by GDP per Capita (1700–1765)</title>
    <link rel="icon" href="favicon.png" />
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #23262b;
            color: #e8eaed;
            font: 15px/1.5 Inter, system-ui, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header { padding: 16px; text-align: center; }
        header h1 { margin: 0 0 4px; font-size: 18px; font-weight: 700; }
        header p { margin: 0; color: #a4abb4; font-size: 13px; }
        .stage {
            width: min(96vw, 1600px);
            aspect-ratio: 16 / 9;
            background: #f3f4f6;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }
        canvas#race { width: 100%; height: 100%; display: block; }
        .controls { display: flex; gap: 10px; align-items: center; padding: 16px; flex-wrap: wrap; justify-content: center; }
        button {
            appearance: none;
            border: 1px solid #3a3f47;
            background: #2d3138;
            color: #e8eaed;
            padding: 9px 18px;
            border-radius: 8px;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #363b43; }
        button.primary { background: #4269d0; border-color: #4269d0; color: #fff; }
        button.primary:hover { background: #3a5cc0; }
        #status { color: #a4abb4; font-size: 13px; margin-left: 8px; }

        /* capture mode: chrome-free, canvas fills the viewport 1:1 for clean recording */
        body.capture { background: #f3f4f6; }
        body.capture header,
        body.capture .controls { display: none; }
        body.capture .stage {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            max-width: none;
            aspect-ratio: auto;
            border-radius: 0;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>Andah — Top 20 Nations by Real GDP per Capita</h1>
        <p>Andah years 1700–1765 · a bar chart race. Press Play to preview, Record to save a video.</p>
    </header>

    <div class="stage">
        <canvas id="race" width="1920" height="1080"></canvas>
    </div>

    <div class="controls">
        <button id="btn-play" class="primary">▶ Play</button>
        <button id="btn-restart">↺ Restart</button>
        <button id="btn-record">● Record (.webm)</button>
        <span id="status">loading…</span>
    </div>

    <script src="js/bar-chart-race.js"></script>
</body>
</html>
