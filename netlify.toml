# Netlify configuration for Andah Games.
# Build command runs xlsx + wiki pipelines, then publishes the repo root.

[build]
  command = "npm run build"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # MIRAHEZE_USER_AGENT must be set in the Netlify UI (Site settings >
  # Environment variables). Miraheze rejects requests without a descriptive UA.
  # Example value: "AndahGames/1.0 (https://www.djmapping.com)"

# Pretty URLs for the wiki section: /wiki/<slug> -> /wiki.html?p=<slug>
[[redirects]]
  from = "/wiki/*"
  to = "/wiki.html?p=:splat"
  status = 200
  force = false

# Functions bundling: keep the scheduled function light.
[functions]
  node_bundler = "esbuild"
